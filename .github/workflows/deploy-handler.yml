name: Deploy Handler
on:
  repository_dispatch:
    types: [deploy-command]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          # 1. Get Repo Name from the payload's repository object
          repository: ${{ github.event.client_payload.repository.full_name }}
          # 2. Get PR Number from the payload's pull_request object
          ref: refs/pull/${{ github.event.client_payload.pull_request.number }}/head

      - name: Run Deploy
        run: |
          echo "✅ Successfully checked out PR #${{ github.event.client_payload.pull_request.number }}"
          echo "Target Machine: ${{ github.event.client_payload.slash_command.args.named.machine }}"
