name: Deploy Handler
on:
  repository_dispatch:
    types: [deploy-command]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.slash_command.args.named.repository }}
          ref: refs/pull/${{ github.event.client_payload.slash_command.args.named.pr_number }}/head

      - name: Run Deploy
        run: |
          echo "Deploying branch from PR #${{ github.event.client_payload.slash_command.args.named.pr_number }}"
