name: Deploy Handler
run-name: Deploy Branch from PR
description: Deploys a branch from a pull request to the target machine.
on:
  repository_dispatch:
    types: [deploy-command]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.repository.full_name }}
          ref: refs/pull/${{ github.event.client_payload.pull_request.number }}/head
      - name: Extract Flags
        env:
          MACHINE_NAME: ${{ github.event.client_payload.slash_command.args.named.machine }}
          API_KEY: ${{ github.event.client_payload.slash_command.args.named.api }}
        run: |
          echo "Machine Name: $MACHINE_NAME"
          echo "API Key: $API_KEY"
      - name: Run Deploy
        run: |
          echo "✅ Successfully checked out PR #${{ github.event.client_payload.pull_request.number }}"
          echo "Target Machine: $MACHINE_NAME"
