name: Deploy Handler
on:
  repository_dispatch:
    types: [deploy-command]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 👇 ADD THIS DEBUG STEP
      - name: 🔍 Debug Payload
        run: |
          echo "Checking what data was sent..."
          echo "PR Number: '${{ github.event.client_payload.slash_command.args.named.pr_number }}'"
          echo "Repository: '${{ github.event.client_payload.slash_command.args.named.repository }}'"
          
          echo "--- FULL PAYLOAD JSON ---"
          echo '${{ toJson(github.event.client_payload) }}'
